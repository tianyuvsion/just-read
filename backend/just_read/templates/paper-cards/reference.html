<div class="page">
  <div class="pagehead"><h1>PVDF–HFP@Nafion 准固态聚合物电解质与高迁移数钠氧电池</h1><span class="meta">He, Ni, Ma, Zhang, Hao, Hou, Li, Yan, Zhang, Chen · PNAS 2024, 121(23) e2320012121</span></div>
  <div class="abs" id="abs"></div>
  <div id="cards"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
const TERMS = {
  '钠氧电池':'用金属钠做负极、空气中的氧气做正极的电池。放电时钠离子和氧气结合生成超氧化钠，充电时再分开。因为不用携带重的正极材料，理论上能存的电特别多。',
  '能量密度':'每公斤材料能存多少电，单位 Wh/kg。数字越大，同样重量能跑得越远。',
  '电解液':'电池里让离子在正负极之间来回跑的液体。传统钠氧电池用有机溶剂配成，易挥发、易燃、会漏。',
  '准固态电解质':'把液体电解液吸进一张聚合物膜里，让它像果冻一样不流动。不漏、不易燃，但离子在里面跑得比在纯液体里慢。',
  '枝晶':'充电时钠离子在负极表面沉积成金属钠，如果沉积不均匀，就会长出树枝或针一样的凸起。长到刺穿隔膜就会短路。',
  '电流密度':'单位面积上流过的电流，mA/cm²。越大说明电池充放电越快。这篇论文里聚合物准固态电池的老毛病是只能在小电流下工作。',
  '迁移数':'电流由正负两种离子共同搬运，钠离子迁移数 t₊ 是钠离子搬运的那一份占比（0 到 1）。t₊ 越高，负极附近越不容易出现"缺盐"，沉积越均匀。',
  '负离子':'带负电的离子。这篇论文里的负离子是三氟甲磺酸根 OTF⁻，它只是陪着钠离子溶解，本身不参与电极反应，但会跟着电流跑。',
  '磺酸基':'Nafion 分子上带负电的 –SO₃⁻ 基团。同性相斥，它会把同样带负电的 OTF⁻ 挡住，却让带正电的钠离子通过。',
  'Nafion':'一种含氟聚合物膜，分子链上挂满磺酸基，常用于燃料电池。这篇论文把它做成 4 微米薄层贴在多孔膜上。',
  'PVDF–HFP':'一种含氟聚合物，做成膜后布满 20–100 纳米的小孔，像海绵一样吸住电解液。耐高压、耐热，是准固态电解质常用的骨架。',
  'SEI':'固体电解质界面膜：金属钠表面和电解液反应生成的一层薄壳。含氟化钠（NaF）多的 SEI 更稳定，有利于钠均匀沉积。',
  '过电位':'让电流流过所需的额外电压。数字越小，说明界面越顺畅、损耗越小。',
  '库仑效率':'放出的电量占充进电量的比例。越接近 100%，每圈损失越少。',
  '电位差':'充电电压与放电电压之差。差值越小，来回一圈浪费的能量越少。',
  '结合能':'两个分子"抓"在一起的牢固程度，负得越多抓得越牢。这里指负离子 OTF⁻ 被聚合物抓住的强度。',
  '亲钠':'表面容易让钠沉积上去的性质。亲钠的地方钠先在那里长。',
  'MXene':'一类二维层状陶瓷材料，这里用的是羟基化的 Ti₃C₂，对钠很亲。',

function barsSvg(items,opts){ const W=300,H=opts.arrow?116:108,pad={l:36,r:8,t:opts.arrow?34:26,b:28}; const min=opts.min,max=opts.max; const n=items.length; const bw=Math.min(46,(W-pad.l-pad.r)/n*.62); const step=(W-pad.l-pad.r)/n; const tickStep=opts.tick||2; const fmt=opts.fmt||(v=>v.toFixed(2));
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img">`; const ticks=[]; for(let v=Math.ceil(min/tickStep)*tickStep; v<=max+1e-9; v+=tickStep) ticks.push(+v.toFixed(6));
  ticks.forEach(v=>{ const y=H-pad.b-(v-min)/(max-min)*(H-pad.t-pad.b); g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#f0f0ec"/><text x="${pad.l-4}" y="${y+3}" text-anchor="end" font-size="8.5" fill="#a5a8b2">${v}</text>`; });
  g+=`<line x1="${pad.l}" y1="${pad.t-4}" x2="${pad.l}" y2="${H-pad.b}" stroke="#d4d4cf"/><line x1="${pad.l}" y1="${H-pad.b}" x2="${W-pad.r}" y2="${H-pad.b}" stroke="#d4d4cf"/>`;
  g+=`<text transform="translate(8,${(pad.t+H-pad.b)/2}) rotate(-90)" text-anchor="middle" font-size="9" fill="#8e929c">${opts.ylab}</text>`;
  g+=`<text x="${pad.l+(W-pad.l-pad.r)/2}" y="${H-3}" text-anchor="middle" font-size="9" fill="#8e929c">${opts.xlab}</text>`;
  items.forEach((it,i)=>{ const cx=pad.l+step*(i+.5); const v=it.value; const h=v==null?0:(v-min)/(max-min)*(H-pad.t-pad.b); const y=H-pad.b-h; const col=it.color||'#8a8f9c';
    if(v==null){ g+=`<rect x="${cx-bw/2}" y="${H-pad.b-30}" width="${bw}" height="30" rx="6" fill="none" stroke="#cfcfc9" stroke-dasharray="3 3"/><text x="${cx}" y="${H-pad.b-36}" text-anchor="middle" font-size="9.5" fill="#8e929c">${it.note||'未报告'}</text>`; }
    else { g+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(2,h)}" rx="6" fill="${col}" ${it.hatch?'stroke="'+col+'" stroke-dasharray="3 2" fill-opacity=".25"':''}/>`; g+=`<text x="${cx}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="600" fill="#1d2026">${fmt(v)}${opts.unit||''}</text>`; }
    g+=`<text x="${cx}" y="${H-pad.b+11}" text-anchor="middle" font-size="9.5" fill="#585d69">${it.label}</text>`; });
  if(opts.arrow){ const [i,j,txt,col]=opts.arrow; const x1=pad.l+step*(i+.5), x2=pad.l+step*(j+.5); const y=pad.t-6; g+=`<path d="M${x1},${y} C${x1},${y-12} ${x2},${y-12} ${x2},${y}" fill="none" stroke="${col}" stroke-width="1.3"/><text x="${(x1+x2)/2}" y="${y-13}" text-anchor="middle" font-size="10" fill="${col}">${txt}</text>`; }
  return g+'</svg>'; }
const tip=$('#tip'); function showTip(t){ tip.innerHTML=`<b>${t.dataset.term}</b><br>${TERMS[t.dataset.term]||''}`; tip.classList.add('on'); const r=t.getBoundingClientRect(); tip.style.left=Math.max(12,Math.min(r.left,window.innerWidth-282))+'px'; const th=tip.offsetHeight||60; tip.style.top=(r.bottom+8+th>window.innerHeight-8 ? Math.max(8,r.top-8-th) : r.bottom+8)+'px'; }
document.addEventListener('mouseover',e=>{ const t=e.target.closest('.term'); if(t) showTip(t); });
document.addEventListener('mouseout',e=>{ if(e.target.closest('.term')) tip.classList.remove('on'); });

const ABSTRACT=`<div><b>论文摘要</b>[[钠氧电池]]能存很多电，但液体[[电解液]]会漏、会烧，金属钠还会长出刺一样的[[枝晶]]；把液体锁进聚合物膜里虽然安全，电池却一直只能在很小的电流下工作。本文在多孔膜上加了一层只让钠离子通过的 [[Nafion]]，把在膜里乱跑的[[负离子]]拦住，再配上让钠从底部开始沉积的[[骨架]]负极，做出的准固态钠氧电池寿命比液体电解液电池长了十几倍。</div><div class="foot">依据原文 Abstract（p.1）整理；带虚线的词悬停可见解释。七张小卡点开后在窗口内阅读。</div>`;

{ id:'q', kind:'研究问题', h2:'准固态钠氧电池能否既安全又能在较大电流下工作？', brief:'液体电解液会漏、易燃，把它锁进聚合物膜虽然安全，电池却一直只能在很小的电流下工作。论文要弄清原因，并让这类电池在较大电流下稳定循环。', sum:'钠氧电池能存很多电，但液体电解液会漏、易燃，金属钠还长枝晶。把液体锁进聚合物膜能解决安全问题，却一直只能在很小的电流下工作。这篇论文问的是：这类膜为什么跑不了大电流，以及怎样改。', pills:['理论能量密度 1,108 Wh/kg','准固态膜的电流上限 <0.5 mA/cm²','两个改动：Nafion 层 + 梯度骨架负极'],
  tabs:[
   {t:'为什么研究钠氧电池',vis:'qtree:0|p.1 引言第一段',html:`<h3>钠氧电池的吸引力：钠资源丰富，理论上一公斤能存 1,108 瓦时的电，而且比锂便宜得多</h3><p>电动车和电网储能需要更高[[能量密度]]的电池。[[钠氧电池]]用金属钠做负极、空气中的氧气做正极，不用携带重的正极材料，理论能量密度达到 1,108 Wh/kg，而且钠比锂便宜得多。</p><p>但它是一个"开放体系"：正极要接触空气，空气里的水、氧气和二氧化碳会顺着进来腐蚀[[电解液]]和金属负极；金属钠充电时还会长[[枝晶]]，液体电解液又易挥发、易漏。这些问题让它一直停留在实验室。</p><div class="src">出处：p.1 引言第一段（refs 1–9）</div>`},
   {t:'准固态膜的老毛病',vis:'qtree:1|p.1 引言第二、三段',html:`<h3>准固态膜不漏不烧，但电池只能在 <0.5 mA/cm² 的小电流下工作</h3><p>把液体电解液吸进聚合物膜里做成[[准固态电解质]]，能同时挡住漏液、燃烧和空气污染，膜本身的硬度还能顶住枝晶。常用的膜材料有 PVDF、[[PVDF–HFP]]、PAN、PMMA、PEO，其中 PVDF–HFP 的[[电化学窗口]]宽（4.8 V 以上不分解）、耐热，最受关注。</p><p>可作者指出两件事：一是 PVDF–HFP 膜很少被用到钠氧电池上，只有少数锂氧、锂二氧化碳、钠二氧化碳电池的先例；二是聚合物膜的[[离子电导率]]比液体差一截，导致这类电池的工作[[电流密度]]一般低于 0.5 mA/cm²，"这个难题至今没有被有效解决"。</p><div class="src">出处：p.1 引言第二、三段（refs 22–36）</div>`},
   {t:'本文的切入点',vis:'qtree:2|p.2 左栏；摘要',html:`<h3>作者的切入点：不追求更高的电导率，而是用 Nafion 层拦住负离子、用梯度骨架让钠从底部开始沉积</h3><p>作者没有去追求更高的电导率，而是换了一个角度：在 PVDF–HFP 膜上复合一层 [[Nafion]]，利用它的[[磺酸基]]拦住[[负离子]]，把钠离子[[迁移数]]提高到 0.68，减轻负极附近的[[浓差极化]]，并促成富含氟化钠的 [[SEI]]。</p><p>负极则沿用作者此前的 [[MXene]] 三层梯度[[骨架]]（M-GSS），让钠优先沉积在骨架底部而不是表面。论文要验证的是：两者组合后，准固态钠氧电池能否在相对较大的电流下稳定循环。</p><div class="src">出处：p.2 左栏"Herein, we report…"段；摘要</div>`},

{ id:'f', kind:'关键发现', h2:'加一层 Nafion 拦住负离子，配合骨架负极后，钠氧全电池的寿命提高了一个数量级', brief:'Nafion 层让电流更多地由钠离子搬运，钠的沉积变得平整；配上梯度骨架负极后，准固态钠氧全电池的循环寿命比液体电解液电池长了十几倍。', sum:'Nafion 层把钠离子迁移数从 0.33 提到 0.68；装了这层膜的对称电池在 1 mA/cm² 下稳定 200 圈、过电位 17 mV；梯度骨架负极在 3 mA/cm² 下稳定 100 圈；三者组合的钠氧全电池从 6 圈跑到 80 圈。', pills:['t₊ 0.33 → 0.68','对称电池 17 mV，200 圈','骨架负极 23 mV，100 圈','全电池 6 → 23 → 80 圈'],
  tabs:[
   {t:'发现一：拦住负离子',vis:'bars:t|Fig. 2G/2H；Fig. 4A；p.3–4',html:`<h3>Nafion 层拦住了负离子，电流里由钠离子搬运的份额从三分之一提高到三分之二</h3><p>用 [[H 型反应器]]做渗透实验：普通 PVDF–HFP 膜 24 小时后另一侧就出现负离子的 [[FTIR]] 信号，48 小时更强；贴了 Nafion 的膜 48 小时内始终没有。用[[计时电流法]]测得钠离子[[迁移数]]分别为 0.33 和 0.68，也就是说加了 Nafion 后，电流里由钠离子搬运的份额从三分之一提高到了三分之二。[[DFT]] 计算解释了原因：负离子 OTF⁻ 与 Nafion 的[[结合能]]是 −0.886 eV，与 PVDF–HFP 只有 −0.087 eV。</p><div class="kv"><div><b>0.33 → 0.68</b><span>钠离子迁移数 t₊</span><i>Fig. 2G/2H</i></div><div><b>−0.087 → −0.886 eV</b><span>OTF⁻ 与聚合物的结合能</span><i>Fig. 4A</i></div></div><p>代价是[[阻抗]]从 4.5 Ω 升到 7.1 Ω，[[离子电导率]]从 5.31 降到 3.64 ×10⁻⁴ S/cm，作者认为仍处于可用水平（10⁻⁴ 量级）。</p><div class="src">出处：Fig. 2A–H, p.3；Fig. 3A, p.4；Fig. 4A, p.4</div>`},
   {t:'发现二：钠面变平',vis:'bars:sym1|Fig. 3B–G；p.4',html:`<h3>装了 Nafion 膜后，只有钠电极的对称电池能在 1 mA/cm² 下稳定循环 200 圈，钠表面保持平整</h3><p>两边都用金属钠的[[对称电池]]专门考察沉积是否稳定。普通 PVDF–HFP 膜的电池在 1.0 mA/cm²、1.0 mAh/cm² 条件下电压剧烈波动；换成带 Nafion 的 QPE 后电压平稳，[[过电位]]只有约 17 mV。200 圈后拆开看：普通膜一侧的钠表面出现大坑和粗糙面，Nafion 一侧的钠面平整、没有孔洞。</p><p>[[XPS]]（分析表面几纳米里有哪些元素和化合物）显示靠 Nafion 一侧的 [[SEI]] 含氟更多、氟化钠的信号更强。作者把这归因于 Nafion 的含氟基团，认为富含 NaF 的 SEI 有利于钠离子迁移。</p><div class="src">出处：Fig. 3B–G, p.4</div>`},
   {t:'发现三：骨架填底',vis:'bars:sym3|Fig. 5A–C；p.5–6',html:`<h3>梯度骨架负极让钠从底部开始填充，在 3 mA/cm² 的较大电流下稳定循环 100 圈以上</h3><p>M-GSS 骨架由三层组成，[[亲钠]]的 h-Ti₃C₂ 含量自底向上递减。沉积 10 mAh/cm² 的钠后，骨架从 221 µm 增厚到 248 µm，[[SEM]] 显示钠从底部开始填充：底部最致密，中部由微米级钠颗粒组成，表面疏松多孔。</p><p>[[对称电池]]在 3.0 mA/cm²、3.0 mAh/cm² 的较大电流下：M-GSS/Na 稳定超过 100 圈，过电位约 23 mV；只用碳纳米管骨架的电池电压波动且过电位上升；纯钠 57 小时后剧烈波动并短路。</p><div class="src">出处：Fig. 5A–C, p.5–6；SI Fig. S6</div>`},
   {t:'发现四：全电池循环 80 圈',vis:'bars:full|Fig. 5E–H；p.5–6',html:`<h3>膜和骨架组合后，钠氧全电池稳定循环 80 圈，而液体电解液电池只有 6 圈</h3><p>三种电池在同样条件下测试（1,000 mA/g，[[限容]] 1,000 mAh/g，按 [[Super P]] 载量折合 0.14 mA/cm² 和 0.14 mAh/cm²）：液体电解液 + 纯钠只跑 6 圈；QPE 膜 + 纯钠 23 圈；QPE 膜 + M-GSS 骨架 80 圈，平均[[库仑效率]] 96.07%，80 圈后充放电[[电位差]]约 0.166 V，放电容量没有明显衰减。</p><div class="kv"><div><b>6 → 23 → 80 圈</b><span>三种电池的循环寿命</span><i>Fig. 5E–G</i></div><div><b>96.07% · 0.166 V</b><span>平均库仑效率 · 80 圈后电位差</span><i>Fig. 5G/5H</i></div></div><p>作者的结论：膜和负极的协同作用显著提高了钠氧电池的循环稳定性。</p><div class="src">出处：Fig. 5E–H, p.5–6</div>`},
  ]},
/* ---------- 3 实验过程与结果 ---------- */
{ id:'e', kind:'实验过程与结果', h2:'实验先验证膜本身，再验证它拦负离子的能力，最后装成电池比寿命', brief:'先看膜的结构、防水和阻燃性能，再用渗透实验和迁移数测试证明膜拦住了负离子，用对称电池比较钠沉积的稳定性，最后组装三种钠氧全电池比较循环寿命。', sum:'先看膜长什么样（SEM、AFM、FTIR），再测它安不安全（防水、阻燃），然后用渗透实验和迁移数证明它能拦负离子，用对称电池证明钠沉积变稳，最后组装钠氧全电池比寿命。每一步的数值都可以在这里查到。', pills:['膜表征','安全测试','渗透实验','迁移数与电导率','对称电池','全电池'],
  tabs:[
   {t:'膜表征',vis:'exp:mem|Fig. 1B–H；p.2',html:`<h3>膜的结构：48 微米厚的多孔 PVDF–HFP 层，贴着一层 4 微米厚、孔更小的 Nafion</h3><p>用[[相转化法]]制得 PVDF–HFP 膜，再滴涂 Nafion。[[SEM]] 截面显示 PVDF–HFP 层 48 µm、布满 20–100 nm 的孔（均值 60 nm）；Nafion 层约 4 µm、孔 5–20 nm（均值 10 nm）。[[AFM]]（用极细的探针扫描表面）测得表面粗糙度 18.5 nm、[[杨氏模量]] 33.1 GPa。[[FTIR]]（红外光谱，看分子里有哪些基团）在 637 cm⁻¹ 处出现 Nafion 磺酸基的峰、在 1,092 cm⁻¹ 处出现溶剂的 C–O–C 峰，而且 C–O–C 峰的位置比纯溶剂略有偏移，说明膜和溶剂分子之间有相互吸引，液体不容易跑出来。</p><table class="tb"><tr><td>PVDF–HFP 层厚 / 孔径</td><td><b>48 µm</b> / 20–100 nm，均值 60 nm</td></tr><tr><td>Nafion 层厚 / 孔径</td><td><b>4 µm</b> / 5–20 nm，均值 10 nm</td></tr><tr><td>粗糙度 / 杨氏模量</td><td><b>18.5 nm</b> / <b>33.1 GPa</b></td></tr><tr><td>吸液率（TGA）</td><td>12.05% → <b>16.62%</b></td></tr></table><div class="src">出处：Fig. 1B–H, p.2；SI Fig. S1–S4</div>`},
   {t:'安全测试',vis:'exp:safe|Fig. 1I–K；p.2–3',html:`<h3>安全测试：膜能挡住水滴保护钠片，遇到明火也不燃烧</h3><p>防水实验：把钠片分别盖上普通 Celgard 隔膜和 PVDF–HFP@Nafion 膜，往上滴水。Celgard 盖住的钠片不到 120 秒就因进水发生副反应，变成一小块不规则的钠；PVDF–HFP@Nafion 盖住的钠片完好无损。作者归因于膜的非贯通纳米孔和含氟链的疏水性。</p><p>阻燃实验：Celgard 隔膜在明火下 4 秒烧尽；PVDF–HFP 膜只是轻微形变。锁液实验：按压后普通玻璃纤维隔膜渗出电解液，QPE 没有。</p><table class="tb"><tr><td>Celgard 覆盖的钠片</td><td>&lt;120 s 被水毁</td></tr><tr><td>PVDF–HFP@Nafion 覆盖的钠片</td><td><b>完好</b></td></tr><tr><td>Celgard 明火</td><td>4 s 烧尽</td></tr><tr><td>PVDF–HFP 明火</td><td><b>轻微形变</b></td></tr></table><div class="src">出处：Fig. 1I–K, p.2–3</div>`},
   {t:'渗透实验',vis:'exp:hcell|Fig. 2A–D；p.3',html:`<h3>渗透实验：普通膜 24 小时就漏过负离子，Nafion 膜 48 小时不漏</h3><p>[[H 型反应器]]中间夹膜，左边放纯溶剂 G2，右边放 1 M NaOTF/G2。在 0、24、48 小时取左侧溶液做 [[FTIR]]。普通 PVDF–HFP 膜：24 小时后左侧出现 –SO₃ 峰，说明 OTF⁻ 负离子已穿膜到达纯溶剂一侧，48 小时更明显，右侧对应峰减弱。PVDF–HFP@Nafion 膜：左侧光谱在 48 小时内与初始一致，负离子没有穿过。</p><table class="tb"><tr><td>PVDF–HFP，24 h</td><td>左侧出现 –SO₃ 峰（637 cm⁻¹）</td></tr><tr><td>PVDF–HFP，48 h</td><td>峰更强</td></tr><tr><td>PVDF–HFP@Nafion，48 h</td><td><b>左侧无变化</b></td></tr></table><div class="src">出处：Fig. 2A–D, p.3；SI Fig. S5</div>`},
   {t:'迁移数与电导率',vis:'exp:t|Fig. 2E–H；Fig. 3A；p.3–4',html:`<h3>钠离子迁移数从 0.33 提高到 0.68，代价是离子电导率下降约三成，作者认为仍在可用范围</h3><p>[[迁移数]]用[[计时电流法]]测：给两片钠夹着膜的[[对称电池]]加一个很小的固定电压，一开始钠离子和负离子都在动、电流大；负离子很快在两侧堆积、不再净移动，电流掉到只剩钠离子搬运的那部分。稳定电流占初始电流的比例（扣除界面[[阻抗]]的变化）就是迁移数。PVDF–HFP：电流从 0.05109 掉到 0.01236 mA，界面阻抗 176 → 219 Ω，算得 t₊ = 0.33。PVDF–HFP@Nafion：电流从 0.01321 掉到 0.00942 mA，阻抗 295 → 382 Ω，t₊ = 0.68。</p><p>电导率由阻抗谱得到：加 Nafion 后膜本身的电阻从 4.5 升到 7.1 Ω，[[离子电导率]]从 5.31 降到 3.64 ×10⁻⁴ S/cm。作者指出仍在 10⁻⁴ 量级（这是聚合物电解质通常能接受的水平），而且膜的吸液率上升（12.05% → 16.62%）部分抵消了电阻的增加。</p><div class="src">出处：Fig. 2E–H, p.3；Fig. 3A, p.4</div>`},
   {t:'对称电池',vis:'exp:sym|Fig. 3B–E；Fig. 5C；p.4–6',html:`<h3>对称电池测试表明：Nafion 膜在 1 mA/cm² 下、梯度骨架在 3 mA/cm² 下都能让钠稳定地沉积和溶解</h3><p>[[对称电池]]排除正极的影响，只看钠的沉积与溶解。膜的对比（1.0 mA/cm²，1.0 mAh/cm²）：PVDF–HFP 电压剧烈波动；QPE 平稳，[[过电位]]约 17 mV，200 圈后钠面平整。负极的对比（3.0 mA/cm²，3.0 mAh/cm²）：M-GSS/Na 稳定超过 100 圈，过电位约 23 mV；CNTs/Na 波动且过电位上升；纯钠 57 小时后波动并短路。</p><table class="tb"><tr><td>PVDF–HFP + 纯钠，1 mA/cm²</td><td>电压剧烈波动</td></tr><tr><td>QPE + 纯钠，1 mA/cm²</td><td><b>约 17 mV</b>，200 圈</td></tr><tr><td>纯钠，3 mA/cm²</td><td>57 h 后短路</td></tr><tr><td>M-GSS/Na，3 mA/cm²</td><td><b>约 23 mV</b>，&gt;100 圈</td></tr></table><div class="src">出处：Fig. 3B–E, p.4；Fig. 5C, p.5–6</div>`},
   {t:'全电池',vis:'exp:full|Fig. 5E–H；p.5–6',html:`<h3>三种钠氧全电池同条件比较：液体电解液 6 圈、换成 Nafion 膜 23 圈、再换骨架负极 80 圈</h3><p>正极为喷涂在碳纸上的 [[Super P]] 炭黑，[[载量]] 0.14 ± 0.01 mg/cm²（每平方厘米碳纸上只有零点一几毫克炭黑，所以按面积折算的电流和容量都很小）。以 1,000 mA/g 充放电（折合 0.14 mA/cm²），[[限容]] 1,000 mAh/g（0.14 mAh/cm²）。Na|LE|O₂（液体电解液）6 圈后失效；Na|QPE|O₂ 23 圈；M-GSS/Na|QPE|O₂ 80 圈，平均[[库仑效率]] 96.07%，80 圈后[[电位差]]约 0.166 V，放电容量未见明显衰减。</p><table class="tb"><tr><td>Na | 液体电解液 | O₂</td><td><b>6 圈</b></td></tr><tr><td>Na | QPE | O₂</td><td><b>23 圈</b></td></tr><tr><td>M-GSS/Na | QPE | O₂</td><td><b>80 圈</b>，CE 96.07%，电位差 0.166 V</td></tr></table><div class="src">出处：Fig. 5E–H, p.5–6；p.6 Materials and Methods</div>`},
  ]},
/* ---------- 4 研究方法 ---------- */
{ id:'m', kind:'研究方法', h2:'分别制备复合膜和骨架负极，装成纽扣电池测试，并用计算解释机理', brief:'膜用[[相转化法]]制成后滴涂 Nafion，骨架用[[真空抽滤]]叠成三层，两者在手套箱里装成纽扣电池；表征用电镜、光谱等手段，机理用量子化学和有限元计算解释。', sum:'膜用相转化法浇铸 PVDF–HFP 再滴涂 Nafion；负极用真空抽滤叠出三层 MXene 骨架；电池在氩气手套箱里装成 CR2032 纽扣电池；表征用 SEM、AFM、FTIR、XPS、TGA；理论部分用 DFT 算结合能、用有限元算电场。', pills:['相转化制膜','真空抽滤骨架','CR2032 组装','DFT + FEM'],
  tabs:[
   {t:'制膜',vis:'prep:0|p.6 Materials and Methods',html:`<h3>制膜两步：相转化法做多孔 PVDF–HFP 膜，再滴涂 Nafion</h3><p>第一步，[[相转化法]]制 PVDF–HFP 膜：4.0 g PVDF–HFP 溶于 50 mL 丙酮，55 °C 搅拌 4 h 至均匀；刮涂在铝箔上，80 °C 干燥 10 h。第二步，取 3 µL 5% 的 Nafion 水溶液滴在直径 18 mm 的膜片上，得到 PVDF–HFP@Nafion。</p><p>准固态电解质（QPE）= 这张膜 + 1 M NaOTF/G2 电解液（三氟甲磺酸钠溶于二甘醇二甲醚），膜把液体吸进孔里。</p><table class="tb"><tr><td>PVDF–HFP 用量 / 溶剂</td><td>4.0 g / 丙酮 50 mL</td></tr><tr><td>溶解</td><td>55 °C，4 h</td></tr><tr><td>成膜</td><td>刮涂铝箔，80 °C，10 h</td></tr><tr><td>Nafion</td><td>3 µL，5%，Ø18 mm</td></tr></table><div class="src">出处：p.6 Materials and Methods</div>`},
   {t:'制骨架',vis:'prep:1|p.6 Synthesis of M-GSS Scaffolds',html:`<h3>制骨架：三种 MXene/碳纳米管分散液依次真空抽滤成三层</h3><p>把羟基化的 Ti₃C₂（h-Ti₃C₂，一种 [[MXene]]）与碳纳米管按质量比 0:1、0.3:1、1.0:1 配成三种分散液（碳纳米管浓度 2.0 g/L，各 10 mL），按 1.0-h-Ti₃C₂/CNTs → 0.3-h-Ti₃C₂/CNTs → CNTs 的顺序[[真空抽滤]]叠加，得到底层最[[亲钠]]、往上递减的三层骨架，厚约 221 µm。</p><p>制备方法来自作者此前的两篇工作（refs 18、37）。</p><div class="src">出处：p.6 Synthesis of M-GSS Scaffolds；p.5</div>`},
   {t:'装电池',vis:'prep:2|p.6 Synthesis of the Cathode；Fabrication',html:`<h3>电池在充满氩气的手套箱里装成 CR2032 纽扣电池，正极是喷在碳纸上的炭黑</h3><p>正极：15 mg [[Super P]] 与 660 mg PVDF 粉分散于 150 mL 乙醇，超声后喷涂在 12 cm × 14 cm 碳纸上，100 °C 干燥，称重得[[载量]] 0.14 ± 0.01 mg/cm²。电解液：1 M NaOTF 溶于 G2。液体电解液电池用玻璃纤维隔膜、100 µL 电解液。所有电池在氩气[[手套箱]]中装成 CR2032 [[纽扣电池]]。</p><div class="src">出处：p.6 Synthesis of the Cathode；Fabrication of Na–O₂ Battery</div>`},
   {t:'表征',vis:'prep:3|p.6 Characterization',html:`<h3>五种表征手段分别看形貌、基团、表面、成分和吸液量</h3><table class="tb"><tr><td>[[SEM]] + EDS</td><td>JEOL JSM-7500F：膜的截面、孔、元素分布；钠面形貌</td></tr><tr><td>[[FTIR]]</td><td>Bruker Tensor II，ATR 模式：–SO₃、C–O–C 等基团</td></tr><tr><td>[[AFM]]</td><td>Bruker Icon：粗糙度与杨氏模量</td></tr><tr><td>[[XPS]]</td><td>PHI 1600，Al Kα 1486.6 eV：SEI 中 F、NaF</td></tr><tr><td>[[TGA]]</td><td>NETZSCH STA 449 F3：吸液率</td></tr><tr><td>电化学</td><td>计时电流 + 阻抗谱测迁移数；恒流充放电测循环</td></tr></table><div class="src">出处：p.6 Characterization</div>`},
   {t:'计算',vis:'prep:4|p.6 DFT Calculations；Finite Element Simulations',html:`<h3>两种计算：DFT 算聚合物抓负离子有多牢，有限元算膜内电场是否均匀</h3><p>[[DFT]]（用量子化学算分子之间抓得多牢）：软件 Gaussian 16，用常见的 B3LYP/6-311+G(d,p) 精度设定优化分子结构，并用频率计算确认结构是稳定的。[[结合能]] = 负离子与聚合物片段结合后的能量 − 两者各自的能量，数值越负说明抓得越牢；片段 A 取 PVDF–HFP 或 Nafion 的一小段分子。</p><p>[[FEM]]（把膜切成小格子算电场怎样分布）：求解静电方程 E = −∇φ、∇·(ε₀εᵣE) = ρ，即电场由电位差决定、电荷决定电场的强弱。PVDF–HFP 体系建为 420 nm × 48 µm，PVDF–HFP@Nafion 为 420 nm × 52 µm；PVDF–HFP 用 48 µm、孔 60 nm 的筛板表示，Nafion 用 4 µm、孔 10 nm 的板表示；施加 Δφ = 0.02 V；[[介电常数]]分别取 10（PVDF–HFP）、7.2（G2）、6（Nafion）。作者明确说明这是简化模型，只用于比较孔径和介电常数对电场分布的影响，不能复现真实孔结构。</p><div class="src">出处：p.6 DFT Calculations；Finite Element Simulations；p.5</div>`},
  ]},

{ id:'r', kind:'文献关系图谱', h2:'论文处在钠氧电池、金属钠负极和准固态电解质三条研究脉络的交汇点', brief:'负极沿用作者自己的 MXene 骨架系列，电解质参照燃料电池领域的 Nafion 膜，用来解决准固态电解质电流上不去的老问题。', sum:'', pills:[],
  tabs:[
   {t:'总览',vis:'lineage:-1|p.1–2 引言；p.7 参考文献表',html:`<h3>本文的参考文献分属三条研究脉络，Nafion 膜的做法参照了燃料电池领域</h3><p>图按年份从左到右排，每个圆圈是本文参考文献表里的一篇文献（数字是它在文末的编号，悬停看题目，点它看那条脉络）。上面三条线是从引言和参考文献里能看出的三条研究线：钠氧电池本身、金属钠负极、准固态电解质；最下面一条是相邻领域：燃料电池的 [[Nafion]] 膜、锂金属电池里“含氟 [[SEI]] 更稳定”的认识和计算工具。右端的黑点是本文，它同时接在三条脉络上。</p><p>一句话定位：本文是作者 [[MXene]] 骨架负极系列的第三篇，把它与一张新的复合膜组合，第一次把 [[PVDF–HFP]] 基准固态电解质用到钠氧电池上，并针对"聚合物膜跑不了大电流"这个老问题给出了一个新解法——不追求电导率，而是拦住负离子、提高[[迁移数]]。</p><div class="note ed"><span class="tag ed">编辑归纳</span> 脉络划分依据本文引言的引用语境与参考文献表；文献之间的先后关系按发表年份排列，不表示它们彼此引用。</div><div class="src">出处：p.1–2 引言；p.7 参考文献表</div>`},
   {t:'脉络一：钠氧电池',vis:'lineage:0|p.1；refs 4–7, 22, 44–46',html:`<h3>钠氧电池这条线 2013 年起步，此前的研究集中在正极与放电产物</h3><p>2013 年 Hartmann、Adelhelm 等人报道了第一块室温可充的[[钠氧电池]]（ref 45，Nat. Mater.）：放电产物是[[超氧化钠]] NaO₂，而不是锂氧电池里那种难以分解的过氧化物，所以充电[[过电位]]低于 200 mV，用纯碳正极就能工作。之后这条线主要围绕正极和产物展开：同组 2014 年研究热力学、碳正极的作用和循环寿命（6）；Zhao 2014 年用低过电位电化学拆分 NaO₂ 延长寿命（22）；Yadegari 2015 年做三维空气电极并研究循环机理（46），2016 年写了系统综述（7）；Sun 2017 年用原子层沉积催化剂调控产物形貌（44）；Zhu 2019 年（4）和 Zhao 2021 年（5）分别用混合阳离子电解液和阳离子添加剂改善可充性。</p><p><b>本文与这条线的关系：</b>不碰正极、不研究产物——正极沿用最普通的 [[Super P]] 炭黑，把这条线当作背景（能量密度、开放体系的问题）和 Fig. 5D 里的对比对象（43–46）。</p><div class="src">出处：refs 4–7, 22, 44–46；p.1 引言第一段；p.6 左栏</div>`},
   {t:'脉络二：金属钠负极',vis:'lineage:1|p.1–2；refs 10, 14–19, 37, 40–42',html:`<h3>金属钠负极的防枝晶方法从锂电池学来，作者此前已发表两篇 MXene 骨架</h3><p>金属负极长[[枝晶]]的对策最早在锂上成熟：Lin 与 Cui 2016 年用层状石墨烯做锂的三维[[骨架]]（10），2017 年综述了"复活锂金属负极"的策略（19）。钠沿用了同样三类办法——三维骨架、电解液优化、人工保护层：Luo 2016 年超薄涂层（14）、Wei 2017 年功能离子聚合物膜（16）、Lee 2017 年超高浓度电解液（17）、Wang 2017 年可塑钠负极（42）、Sun 2018 年无枝晶钠负极（41）、本课题组 Ma 2019 年在钠上原位生成铋层（40）、Wang 2022 年用添加剂造出富含 NaF 的 [[SEI]]（15）。</p><p><b>作者自己的三步：</b>2020 年羟基化 MXene/碳纳米管骨架（18，Angew. Chem.）→ 2022 年[[亲钠]]程度自下而上递减的"梯度骨架"M-GSS，让钠氧电池能在大电流下工作（37，Adv. Mater.）→ 本文沿用 M-GSS，把它和新膜组合。本文属于"三维骨架"这一类，再加上"让 SEI 富含 NaF"的思路（呼应 15、21）。</p><div class="src">出处：refs 10, 14–19, 21, 37, 40–42；p.1 引言第二段；p.6 方法</div>`},
   {t:'脉络三：准固态电解质',vis:'lineage:2|p.1；refs 8, 9, 12, 22–36, 43',html:`<h3>准固态电解质的先例多在锂氧、锂二氧化碳电池，用于钠氧电池的只有三篇</h3><p>把液体锁进聚合物膜的[[准固态电解质]]，在金属–气体电池里先用于锂：Jung 2014 年离子液体凝胶锂氧电池（8）、Yi 2016 年混合准固态锂氧电池（24）、Zhang 2017 年多功能凝胶（33）、2017 年凝胶锂二氧化碳电池（34）、Zou 2018 年阻燃凝胶锂氧/空气电池（32）、Zhou 2019 年纤维状锂二氧化碳电池（9）。钠体系的先例只有几篇：Hu 2017 年准固态钠二氧化碳电池（12）、Ma 2018 年 PVDF 中间层抑制钠氧电池枝晶（25）、Wang 2020 年室温柔性准固态钠氧电池（43）。全固态是另一条平行路（23、26）。膜的基体材料有 PVDF、PVDF–HFP、PAN、PMMA、PEO 可选（27–31），PVDF–HFP 因耐高压、耐热最受关注（32）。</p><p><b>这条线的瓶颈</b>：聚合物电解质的[[离子电导率]]比液体差，电池的工作[[电流密度]]普遍低于 0.5 mA/cm²，作者引 35、36 说明"至今没有被有效解决"。<b>本文的位置</b>：作者称 PVDF–HFP 基准固态电解质"很少用于钠氧电池"，本文把它带进钠氧电池，并把解题思路从"提高电导率"换成"提高迁移数"。</p><div class="src">出处：refs 8, 9, 12, 22–36, 43；p.1 引言第二、三段</div>`},
   {t:'相邻领域的启发',vis:'lineage:3|p.4–5；refs 15, 16, 21, 38, 47',html:`<h3>Nafion 膜参照燃料电池的质子交换膜，“含氟 SEI 更稳定”的认识来自锂金属电池</h3><p>[[Nafion]] 是燃料电池里常用的[[质子交换膜]]材料（ref 38 是它在燃料电池里的应用），侧链上的[[磺酸基]]带负电，天然排斥[[负离子]]、只让阳离子通过。把这种“只放一种离子过”的思路用到钠电池的先例是 Wei 2017 年的功能离子聚合物膜（16）。本文把 Nafion 做成 4 µm 的薄层贴在 PVDF–HFP 膜上，用 [[DFT]] 算 OTF⁻ 与两种聚合物的[[结合能]]来解释它为什么拦得住（工具：Gaussian 16，47）。</p><p>另一个来自锂金属电池领域的认识是"含氟的 SEI 更好"：Li 2019 年在高压锂金属电池里论证氟化 SEI 的价值（21），Wang 2022 年在钠上用添加剂做出 NaF 富集的 SEI（15）；本文把 Nafion 的含氟基团当作 NaF 的来源。有限元模拟里的介电常数取值来自 4、39。</p><div class="src">出处：refs 4, 15, 16, 21, 38, 39, 47；p.4–5</div>`},
   {t:'本文的定位',vis:'pos:0|p.1–2 引言；p.6 结论',html:`<h3>本文同时属于三个研究方向：准固态钠氧电池、拦负离子的聚合物膜、梯度骨架钠负极；改的是电解质和负极，不涉及正极</h3><p><b>在钠氧电池里</b>：属于"电解质 + 负极"一侧的工作，不涉及正极催化和产物化学。<b>在准固态电解质里</b>：不是新基体、也不是提高电导率，而是加一层阴离子拦截层提高[[迁移数]]——这和之后兴起的[[单离子导体]]路线是同一个方向（见"局限与后续研究"卡）。<b>在钠负极里</b>：是作者 MXene 梯度骨架系列的延续，本文的新意在组合而不在负极本身。</p><div class="note ok"><span class="tag obs">后来者怎么看它</span> 2025 年 Yahia 等人（Adv. Sci.）在梳理准固态钠氧电池先例时引用本文，肯定其阻燃、锁液、疏水和 80 圈的结果，同时提出含氟聚合物遇到[[超氧化钠]]中的超氧根可能因 C–F 键断裂而降解——这是对本文路线的一个直接质疑。</div><div class="note ed"><span class="tag ed">检索补充</span> "后来者"一段来自 2025 年文献，不在本文参考文献表内。</div><div class="src">出处：p.1–2 引言；Yahia et al., Adv. Sci. 2025（PMC12376506）</div>`},
  ]},

{ id:'l', kind:'研究局限', h2:'全电池只在很小的电流下验证过，“大电流下稳定”的证据来自更简单的对称电池', brief:'作者说明两处计算都是简化模型；钠氧全电池本身只在很小的电流下循环过，较大电流下的稳定性证据来自只有钠电极的对称电池。另有几个原文没有回答的问题。', sum:'作者自己说明了两处简化：有限元模型不能复现真实孔结构；DFT 用的是聚合物片段。数据的适用范围也有边界：全电池仍在 0.14 mA/cm² 的小电流下运行，"较大电流"的证据来自对称电池。此外有几个问题论文没有涉及。', pills:['作者自述的简化','数据适用范围','未回答的问题（编辑归纳）'],
  tabs:[
   {t:'自述的简化',vis:'scope:0|p.6 Finite Element Simulations；p.4',html:`<h3>作者明确说明：有限元模型和 DFT 计算都是简化模型，只用于比较趋势，不能复现真实环境</h3><div class="note"><span class="tag obs">原文自述</span> [[FEM]] 模型"不能完全复现真实世界条件"：膜被建成固定孔径的筛板（60 nm 与 10 nm），只用于比较孔径和[[介电常数]]对电场分布的影响。</div><div class="note"><span class="tag obs">原文自述</span> [[DFT]] 计算的是 OTF⁻ 与 PVDF–HFP、Nafion 片段的结合能，是对"Nafion 更擅长抓负离子"的支持性证据，不是膜内真实环境的完整模拟。</div><p>此外，Fig. 5D 与文献的对比数值放在补充材料 Table S1，主文只给出了定性结论"优于大多数碳基钠负极"。</p><div class="src">出处：p.6 Finite Element Simulations；p.4 DFT；p.6 左栏</div>`},
   {t:'数据的适用范围',vis:'scope:1|Fig. 3B/3C；Fig. 5C；Fig. 5E–H；p.6',html:`<h3>钠氧全电池只在 0.14 mA/cm² 的小电流下循环过，“较大电流下稳定”的证据来自只有钠电极的对称电池</h3><p>图中横轴是[[电流密度]]、纵轴是循环圈数，每个点是论文实际报告过的一组条件。"较大电流"下的稳定性证据（1 和 3 mA/cm²）来自[[对称电池]]，只考察钠的沉积与溶解；钠氧全电池本身运行在 0.14 mA/cm²、[[面容量]] 0.14 mAh/cm²，这与实用电池通常需要的几 mAh/cm² 还有数量级差距。</p><p>所有数据来自 CR2032 [[纽扣电池]]和实验室条件，未报告大面积制膜的一致性和长期空气暴露下的表现。</p><div class="src">出处：Fig. 3B/3C；Fig. 5C；Fig. 5E–H；p.6</div>`},
   {t:'未答的问题',vis:'scope:2|p.6 Conclusion',html:`<h3>原文没有回答的五个问题（编辑归纳）</h3><div class="note ed"><span class="tag ed">编辑归纳</span> 以下为根据原文内容整理的开放问题，原文未作陈述。</div><ul class="refl"><li>80 圈之后电池为什么衰减：论文只报告到 80 圈，未给出失效分析。</li><li>能否把全电池电流从 0.14 mA/cm² 提到对称电池验证过的 1–3 mA/cm²，同时提高面容量。</li><li>正极侧的产物（超氧化钠）与空气中 CO₂/H₂O 的相互作用在准固态体系下如何，本文全电池未考察空气气氛。</li><li>Nafion 使电导率下降约 30%，更薄的 Nafion 层或其他阴离子捕获基团能否在保持 t₊ 的同时减少损失。</li><li>成本与放大：3 µL Nafion 滴涂在 18 mm 膜片上，大面积均匀制备的工艺未讨论。</li></ul><div class="note ok"><span class="tag obs">原文展望</span> 作者的表述是：这项工作"可为构建长循环稳定的准固态钠氧电池提供参考"。</div><div class="src">出处：Conclusion, p.6</div>`},

  ]},
/* ---------- 7 后续研究 ---------- */
{ id:'n', kind:'后续研究', h2:'此后准固态钠氧电池出现了不含氟的新路线，钠负极骨架能承受的电流也高了几倍', brief:'2024 年以来，同类工作里电解质出现了加陶瓷填料、不含氟聚合物、新溶剂三条路，钠负极骨架能承受的电流已是本文的几倍，正极一侧出现了补偿容量损失的思路。当前争论集中在含氟聚合物是否可靠等四个问题。', sum:'', pills:[],
  tabs:[
{t:'后续：电解质',vis:'after:0|检索资料，见右栏来源',html:`<h3>2024–2025 年，准固态钠氧电池的电解质出现了三条新路：加陶瓷填料、改用不含氟的聚合物、换更稳定的溶剂</h3><div class="note ed"><span class="tag ed">检索补充</span> 以下来自 2026 年 9 月检索到的公开文献，不在本文参考文献表内；数值取自各文摘要。</div><ul class="refl"><li><b>2024.7 · Iputera 等，ACS Appl. Mater. Interfaces</b> 走"陶瓷填料"路线：PEO + NaTFSI + 纳米 NZSP 复合膜做准固态钠氧电池，吸液后电导率 3.5×10⁻⁴ S/cm，100 mA/g、限容 500 mAh/g 下 25 圈——与本文同年，电流比本文小一个量级。</li><li><b>2025 · Yahia 等，Adv. Sci.</b> 不含氟的 Pebax1657（聚酰胺–聚醚）准固态膜：电导率 6.57×10⁻⁴ S/cm，[[迁移数]]约 0.40（液体 0.32），150 µA/cm² 浅循环 35 圈（液体 20 圈）。引言把本文列为先例，同时指出含氟聚合物遇超氧根可能因 C–F 键断裂而降解。</li><li><b>2025 · Enterría 等，J. Mater. Chem. A</b> 液体路线仍在推进：把醚类溶剂末端的甲氧基换成叔丁基（"受阻醚"），无衰减循环从 10 圈提高到 91 圈，产物仍是[[超氧化钠]]。</li></ul><div class="src">来源：PMC11261556；PMC12376506；J. Mater. Chem. A 2025, d5ta03233d</div>`},
   {t:'后续：负极与正极',vis:'after:1|检索资料，见右栏来源',html:`<h3>2026 年，钠金属负极的骨架已能在 10 mA/cm² 下稳定沉积（本文对称电池的三倍以上），正极一侧出现了补偿容量损失的思路</h3><div class="note ed"><span class="tag ed">检索补充</span> 同上，均为本文之后的公开文献。</div><ul class="refl"><li><b>2026 · Guo … Bresser，Adv. Sci.</b>（钠金属电池，非钠氧）聚硅氧烷[[单离子导体]]：负离子直接接在聚合物链上，电导率 0.2–0.4 mS/cm，对称电池 >2,000 h、全电池 >1,000 圈，正极[[载量]] 18 mg/cm² 并做了[[软包电池]]。"拦住负离子"的思路从本文的复合层走到了分子层面。</li><li><b>2026 · Yan … Cui，Sci. China Mater.</b>（钠金属电池）亲钠梯度 + 电场梯度的双梯度[[集流体]]，10 mA/cm²、10 mAh/cm² 下稳定 1,185 h——梯度骨架这条线已把电流和面容量推到本文对称电池（3 mA/cm²、3 mAh/cm²）的三倍以上。</li><li><b>2026 · J. Am. Chem. Soc.</b> 用 KO₂ 做固态"超氧化物储库"补偿超氧化物型钠氧电池的不可逆容量——正极产物侧的新思路（仅据题名，全文未能获取）。</li></ul><div class="src">来源：Adv. Sci. 2026, advs.202600077；Sci. China Mater. 2026, s40843-026-4188-x；JACS 2026, 148(31) 33735</div>`},
   {t:'前沿议题',vis:'front:0|检索资料，见右栏来源',html:`<h3>研究者当前关注四件事：含氟聚合物是否可靠、大电流负极能否用于氧气环境、放电产物是否稳定、怎样走向实用</h3><div class="note ed"><span class="tag ed">编辑归纳</span> 据前两节文献的引言与结论整理，非本文观点。</div><ul class="refl"><li><b>电解质：含氟还是不含氟，怎样把负离子固定住。</b> 本文用 Nafion 的含氟磺酸基拦负离子；2025 年的非氟 Pebax 路线担心超氧根攻击 C–F 键；2026 年的单离子导体把负离子直接锚在链上。三者都要高迁移数，分歧在"氟"是资产还是隐患。</li><li><b>负极：大电流、高面容量的骨架能不能进氧气环境。</b> 梯度骨架在封闭的钠金属电池里已到 10 mA/cm²、10 mAh/cm²，但放进开放的钠氧电池、面对 O₂ 和超氧根腐蚀时表现如何，仍缺数据。</li><li><b>正极与产物：NaO₂ 的不稳定与不可逆容量。</b> 超氧化钠会自发分解、造成容量损失，2026 年出现"超氧化物储库"的补偿思路；[[单线态氧]]等活性氧对电解质的破坏是金属–氧气电池的共同难题。</li><li><b>整体：从纽扣电池走向实用。</b> 2025 年的文献仍把"低[[往返效率]]、高过电位、循环差、产物不理想"列为共同障碍；软包、空气气氛（而非纯氧）和长期暴露的测试是所有路线都要过的关。</li></ul><div class="src">来源：前两节文献；Electrochem. Energy Rev. 2023</div>`},
  ]},
];

function svgWrap(inner,vb='0 0 600 400'){ return `<svg viewBox="${vb}" role="img">${inner}</svg>`; }
function qtree(sel){ const box=(x,y,w,h,t,sub,cls,i)=>`<g class="qn" data-i="${i}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${cls==='bad'?'#f9e6e2':cls==='ok'?'#e4f2ea':cls==='hi'?'#e9ecf9':'#fff'}" stroke="${sel===i?'#1d2026':'#d4d4cf'}" stroke-width="${sel===i?2:1}"/><text x="${x+w/2}" y="${y+22}" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2026">${t}</text>${sub.map((s,k)=>`<text x="${x+w/2}" y="${y+40+k*15}" text-anchor="middle" font-size="11" fill="#585d69">${s}</text>`).join('')}</g>`;
  const ar=(x1,y1,x2,y2)=>`<path d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}" fill="none" stroke="#b9bcc8" stroke-width="1.4"/>`;
  let s=''; s+=box(190,14,220,74,'钠氧电池',['理论能量密度 1,108 Wh/kg','钠资源丰富'],'hi',0);
  s+=ar(300,88,150,130)+ar(300,88,450,130);
  s+=box(40,130,220,88,'液体电解液',['会漏、易燃','钠长枝晶','空气侵蚀'],'bad',0);
  s+=box(340,130,220,88,'准固态聚合物膜',['不漏、不燃','但电流 <0.5 mA/cm²','原因未解决'],'bad',1);
  s+=ar(450,218,300,262);
  s+=box(150,262,300,60,'本文的问题',['膜为什么跑不了大电流？怎样改？'],'hi',1);
  s+=ar(300,322,150,352)+ar(300,322,450,352);
  s+=box(30,352,240,42,'Nafion 层：拦负离子',[],'ok',2); s+=box(330,352,240,42,'梯度骨架：钠往底部长',[],'ok',2);
  return svgWrap(s); }

  s+=`<text x="300" y="392" text-anchor="middle" font-size="10" fill="#8e929c">p.6 Materials and Methods</text>`;

  const pts=[{x:0.14,y:80,c:'#2fae86',l:'钠氧全电池 80 圈',s:'M-GSS/Na | QPE | O₂'},{x:0.14,y:23,c:'#5468de',l:'钠氧全电池 23 圈',s:'Na | QPE | O₂',dy:-12},{x:0.14,y:6,c:'#b23f2e',l:'钠氧全电池 6 圈',s:'Na | LE | O₂',dy:8},{x:1,y:200,c:'#8a8f9c',l:'对称电池 200 圈',s:'QPE，17 mV'},{x:3,y:100,c:'#8a8f9c',l:'对称电池 >100 圈',s:'M-GSS/Na，23 mV'}];

  keys.forEach(k=>{ if(root.querySelector(`.term[data-term="${k}"]`)) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ if(skip(n)) continue; const i=n.nodeValue.indexOf(k); if(i<0) continue; const before=n.nodeValue[i-1]||' ', after=n.nodeValue[i+k.length]||' '; if(/[A-Za-z0-9₀-₉⁰-⁹–-]/.test(k[0])&&/[A-Za-z0-9]/.test(before)) continue; if(/[A-Za-z0-9]/.test(k[k.length-1])&&/[A-Za-z0-9]/.test(after)) continue; const s=document.createElement('span'); s.className='term'; s.dataset.term=k; s.textContent=k; const rest=n.splitText(i); rest.nodeValue=rest.nodeValue.slice(k.length); n.parentNode.insertBefore(s,rest); return; } }); }
const CST={open:null,tab:0}; // 当前打开的卡与节
const OV=document.createElement('div'); OV.className='ov'; OV.id='ov';
const XP=document.createElement('section'); XP.className='card c2x'; XP.id='xp'; XP.setAttribute('role','dialog'); XP.setAttribute('aria-modal','true');
XP.innerHTML=`<div class="head"><span class="kind"></span><span class="time"></span><span class="sp"></span><button class="x" aria-label="关闭">×</button></div>
  <div class="bd"><div class="vis"><div class="vp2"><div class="visin" style="width:100%;height:100%;display:grid;place-items:center"></div><div class="vtag"></div><div class="vcap">数据与结构均来自原文；示意部分已在图内注明</div></div></div><aside class="side"><div class="tabs"></div><div class="sbody"></div><div class="snav"></div></aside></div>`;
OV.appendChild(XP);
function closeCard(){ if(!CST.open) return; const id=CST.open; CST.open=null; CST.tab=0; OV.classList.remove('show'); document.body.classList.remove('lock'); setTimeout(()=>{ if(!CST.open) OV.remove(); },200); const t=$('#card-'+id); if(t) t.focus({preventScroll:true}); }
function openCard(id,tab){ CST.open=id; CST.tab=tab||0; renderCard(CARDS.find(c=>c.id===id)); if(!OV.parentNode){ document.body.appendChild(OV); document.body.classList.add('lock'); requestAnimationFrame(()=>requestAnimationFrame(()=>OV.classList.add('show'))); } }
OV.addEventListener('click',e=>{ if(e.target===OV) closeCard(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&CST.open) closeCard(); });
function renderCard(c){ const st=CST; const el=XP; const tab=c.tabs[st.tab]; try{ tip.classList.remove('on'); }catch(e){}
  el.querySelector('.head .kind').textContent=c.kind; el.querySelector('.head .time').textContent=`${c.tabs.length} 节 · 第 ${st.tab+1} 节：${tab.t}`;
  el.querySelector('.vp2 .visin').innerHTML=renderVis(c,tab);
  el.querySelector('.vtag').innerHTML=`<span class="tag">${c.kind}</span><span>${tab.t}</span>`;
  el.querySelector('.tabs').innerHTML=c.tabs.map((t,i)=>`<button class="${i===st.tab?'on':''}" data-i="${i}">${t.t}</button>`).join('');
  el.querySelector('.sbody').innerHTML=T(tab.html); autoTerms(el.querySelector('.sbody')); el.querySelector('.sbody').scrollTop=0;
  const nx=c.tabs[st.tab+1]; el.querySelector('.snav').innerHTML=`<button class="ghostb" data-go="-1" ${st.tab===0?'disabled':''}>←</button>${nx?`<button class="nextb ready" data-go="1"><span>下一节<small>${nx.t}</small></span><i>→</i></button>`:`<button class="nextb ready" data-go="close"><span>看完了，关闭<small>回到论文页</small></span><i>×</i></button>`}`;
  el.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{ st.tab=+b.dataset.i; renderCard(c); }));
  el.querySelectorAll('.snav button').forEach(b=>b.addEventListener('click',()=>{ const g=b.dataset.go; if(g==='close'){ closeCard(); return; } st.tab=Math.max(0,Math.min(c.tabs.length-1,st.tab+(+g))); renderCard(c); }));
  el.querySelectorAll('.qn,.gnode').forEach(g=>g.addEventListener('click',()=>{ const i=+g.dataset.i; const t=c.nodeTab?c.nodeTab(i):i; st.tab=Math.max(0,Math.min(c.tabs.length-1,t)); renderCard(c); }));
}
XP.querySelector('.x').addEventListener('click',closeCard);
(function(){ const host=$('#cards');
  CARDS.forEach(c=>{ const el=document.createElement('section'); el.className='card c2'; el.id='card-'+c.id; el.tabIndex=0; el.setAttribute('role','button');
    if(c.wide) el.classList.add('wide');
    el.innerHTML=`<div class="mini">${miniVis(c)}</div><div class="tb2"><div class="row"><span class="kind">${c.kind}</span><span class="n">${c.tabs.length} 节</span></div><h2>${c.h2}</h2><p>${T(c.brief)}</p><div class="go">打开 <i>→</i></div></div>`;
    host.appendChild(el); autoTerms(el.querySelector('.tb2 p'));
    el.addEventListener('click',e=>{ if(e.target.closest('.term')) return; openCard(c.id,0); });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCard(c.id,0); } }); });
})();

(function(){ const el=$('#abs'); if(!el) return; el.innerHTML=T(ABSTRACT); autoTerms(el); })();
</script>
<style>
/* ===== 通用卡片（探索模型之外的六张） ===== */

.c2 .mini{height:118px;margin:10px 10px 0;border-radius:12px;background:radial-gradient(110% 90% at 28% 8%,#ffffff 0%,#eef0f6 48%,#e1e5ee 100%);border:1px solid var(--line);display:grid;place-items:center;padding:8px;overflow:hidden}
.c2 .mini svg{width:100%;height:100%}
.c2 .tb2{padding:12px 16px 14px;display:flex;flex-direction:column;flex:1}

.c2 .tb2 .kind{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#f1f1ee;color:var(--ink2)}
.c2 .tb2 .n{font-size:11.5px;color:var(--ink3);margin-left:auto}
.c2 .tb2 h2{font-size:15px;line-height:1.4;margin:0 0 6px;font-weight:650;letter-spacing:-.005em}
.c2 .tb2 p{margin:0;color:var(--ink2);font-size:12.5px;line-height:1.5}
.c2 .tb2 .go{margin-top:auto;padding-top:10px;font-size:12px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:6px}
.c2 .tb2 .go i{font-style:normal;transition:transform .15s}
.c2:hover .tb2 .go i{transform:translateX(3px)}
.ov{position:fixed;inset:0;z-index:60;background:rgba(22,24,30,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:opacity .18s}
.ov.show{opacity:1}
.c2x{width:min(1040px,100%);margin:0;box-shadow:0 30px 80px rgba(20,22,30,.28),0 2px 8px rgba(20,22,30,.08);transform:translateY(10px) scale(.985);transition:transform .2s;cursor:default}
.ov.show .c2x{transform:none}
.c2x .head{padding-right:12px}
.c2x .head .kind{background:#f1f1ee;color:var(--ink2)}
.c2x .head .x{width:34px;height:34px;padding:0;border-radius:10px;font-size:18px;line-height:1;display:grid;place-items:center;background:#fff;border:1.5px solid #b9bcc8;color:var(--ink)}
.c2x .head .x:hover{border-color:var(--ink)}
.c2x .bd{display:grid;grid-template-columns:1fr 430px;height:clamp(440px,calc(100vh - 150px),540px)}
body.lock{overflow:hidden}
.visw{width:100%;height:100%;box-sizing:border-box;padding-bottom:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.visw>svg{flex:1;min-height:0;width:100%}
.visw>div{flex:0 0 auto;max-height:calc(100% - 30px);overflow:hidden}
.c2x .vis .visw>div svg{height:auto;max-height:none}
.viref{flex:none;font-size:11px;color:var(--ink2);text-decoration:none;border-bottom:1px dashed var(--ink3);cursor:pointer}
.viref:hover{color:var(--ink);border-bottom-color:var(--ink)}
.ofig{margin:0;height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.ofig img{max-width:100%;max-height:calc(100% - 44px);object-fit:contain;border-radius:10px;background:#fff;padding:6px;border:1px solid #dfe2e9;box-sizing:border-box}
.ofig figcaption{font-size:11px;line-height:1.45;color:var(--ink2);text-align:center;max-width:60ch;padding:0 8px}
.ofig figcaption b{color:var(--ink)}
.abs{display:grid;grid-template-columns:1fr;gap:10px;margin:4px 0 24px;padding:16px 20px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.abs div{font-size:14px;line-height:1.65;color:var(--ink2);max-width:80ch}
.abs b{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.abs .foot{grid-column:1/-1;font-size:11.5px;color:var(--ink3);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
@media(max-width:720px){.abs{grid-template-columns:1fr}}
.tip{z-index:200}
.gnode.term{cursor:pointer}
@media(max-width:860px){.c2x .bd{grid-template-columns:1fr;height:auto}}
.c2x .vis{padding:14px 12px 14px 16px;min-width:0;min-height:0;display:flex}
.c2x .vis .vp2{flex:1;position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(110% 90% at 28% 8%,#ffffff 0%,#eef0f6 48%,#e1e5ee 100%);border:1px solid #dfe2e9;display:grid;place-items:center;padding:14px}
.c2x .vis svg{width:100%;height:100%;max-height:100%}

.c2x .tabs button{padding:5px 11px;font-size:12.5px}

.c2x .sbody h3{font-size:16px;line-height:1.38;margin:0 0 6px}
.c2x .sbody p{font-size:12.5px;color:var(--ink2);margin:0 0 8px;line-height:1.5}

.c2x .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 8px}

.c2x .kv b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.c2x .kv span{font-size:11.5px;color:var(--ink2)}
.c2x .kv i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3)}
.c2x .note{font-size:12px;color:var(--ink);line-height:1.5;padding:7px 10px;border-radius:9px;background:#f7f7f4;border-left:3px solid var(--ink);margin:6px 0}
.c2x .note.ed{border-left-color:#d3742a;background:#fbf3ea}
.c2x .note.ok{border-left-color:var(--ok)}

.c2x .tag.obs{background:#f1f1ee;color:var(--ink2)}

.c2x .snav .ghostb{width:42px;padding:0;border-radius:12px;font-size:16px;flex:none;background:#fff;border:1.5px solid #b9bcc8;color:var(--ink)}
.c2x .nextb small{max-width:300px}

.c2x table.tb td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}

.gnode{cursor:pointer}
.gnode:hover circle{stroke:var(--ink)}
.qn{cursor:pointer}
.qn:hover rect{stroke:var(--ink)}
</style>
