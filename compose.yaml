services:
  justread:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JUSTREAD_DATABASE_PATH: /app/data/justread.sqlite3
      JUSTREAD_STATIC_DIR: /app/dist
      JUSTREAD_LLM_PROVIDER: ${JUSTREAD_LLM_PROVIDER:-openai}
      JUSTREAD_LLM_MODEL: ${JUSTREAD_LLM_MODEL:-}
      JUSTREAD_LLM_API_KEY: ${JUSTREAD_LLM_API_KEY:-}
      JUSTREAD_LLM_BASE_URL: ${JUSTREAD_LLM_BASE_URL:-}
      JUSTREAD_SEARCH_PROVIDER: ${JUSTREAD_SEARCH_PROVIDER:-auto}
      JUSTREAD_SEARCH_API_KEY: ${JUSTREAD_SEARCH_API_KEY:-}
      JUSTREAD_SEARCH_BASE_URL: ${JUSTREAD_SEARCH_BASE_URL:-https://api.tavily.com}
      JUSTREAD_PROVIDER_TIMEOUT_SECONDS: ${JUSTREAD_PROVIDER_TIMEOUT_SECONDS:-60}
      JUSTREAD_TASK_TIMEOUT_SECONDS: ${JUSTREAD_TASK_TIMEOUT_SECONDS:-1800}
      JUSTREAD_MAX_SOURCES: ${JUSTREAD_MAX_SOURCES:-8}
      JUSTREAD_WORKERS: ${JUSTREAD_WORKERS:-2}
      JUSTREAD_MAX_ACTIVE_TASKS: ${JUSTREAD_MAX_ACTIVE_TASKS:-100}
      JUSTREAD_TERMINAL_RETENTION_SECONDS: ${JUSTREAD_TERMINAL_RETENTION_SECONDS:-86400}
      JUSTREAD_SESSION_TTL_SECONDS: ${JUSTREAD_SESSION_TTL_SECONDS:-2592000}
      JUSTREAD_SESSION_COOKIE_SECURE: ${JUSTREAD_SESSION_COOKIE_SECURE:-false}
      JUSTREAD_PUBLIC_ORIGIN: ${JUSTREAD_PUBLIC_ORIGIN:-}
      JUSTREAD_TEST_MODE: "false"
    volumes:
      - justread-data:/app/data
    init: true
    stop_grace_period: 20s

volumes:
  justread-data:
